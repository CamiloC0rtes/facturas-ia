[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "facturas-ia"
version = "0.1.0"
description = "Lectura de facturas PDF con IA y generación de cobros, con validación anti-alucinación"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Juan Camilo Cortés Sánchez" }]
dependencies = [
    "pydantic>=2.6",
    "defusedxml>=0.7",
    "pymupdf>=1.24",
    "opencv-python-headless>=4.9",
    "pytesseract>=0.3.10",
    "rapidfuzz>=3.6",
    "anthropic>=0.40",
    "openai>=1.40",
    "fastapi>=0.110",
    "python-multipart>=0.0.9",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
ui = ["streamlit>=1.35", "pandas>=2.0", "pillow>=10"]
dev = ["pytest>=8", "httpx>=0.27", "reportlab>=4.1", "facturas-ia[ui]"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
